name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engagedin
          POSTGRES_PASSWORD: engagedin
          POSTGRES_DB: engagedin_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra api
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy engagedin cli api
      - name: Unit tests with coverage
        run: uv run pytest tests/unit/ --cov=engagedin --cov=cli --cov=api --cov-fail-under=100 -n auto -q
      - name: Run migrations
        run: DATABASE_URL=postgresql+asyncpg://engagedin:engagedin@localhost:5433/engagedin_test uv run alembic upgrade head
      - name: Integration tests
        run: POSTGRES_PORT=5433 uv run pytest tests/integration/ -n 4 --dist loadscope -q
